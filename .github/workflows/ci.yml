name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Pull requests only. A superseded PR run tells us nothing, but this key sits
  # at workflow level and takes the whole run with it, and on main a run carries
  # the alpha delivery: cancelling it drops a build the merge is entitled to.
  # workflow_dispatch shares this group and, unlike a push, does full work, so
  # an unconditional key would also have a manual run and a merge killing each
  # other. Two merges a minute apart therefore deliver twice, in order — the
  # tester installs the later one.
  #
  # It also means a group at job level cannot help the alpha job: runs on main
  # are already serialised here, so two alpha jobs never overlap and there is
  # nothing for such a group to cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The decision below diffs against the pull request's merge base, so
          # the history has to reach it. A shallow checkout would otherwise do:
          # the release gate in app/build.gradle.kts only guards tasks that
          # package an artifact, and this job packages nothing.
          fetch-depth: 0

      # The if: goes on every step below, never on the job. All five jobs are
      # required status checks, and a job skipped at job level never reports its
      # context — which blocks the merge button rather than freeing it.
      - name: Decide whether there is work
        id: decide
        uses: ./.github/actions/decide-work

      - name: Set up JDK 17
        if: steps.decide.outputs.run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.decide.outputs.run == 'true'
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        if: steps.decide.outputs.run == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Provide google-services.json
        if: steps.decide.outputs.run == 'true'
        uses: ./.github/actions/google-services
        with:
          secret-b64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}

      - name: Run unit tests
        if: steps.decide.outputs.run == 'true'
        run: ./gradlew testDebugUnitTest --stacktrace

      # Its own step, not folded into the one above: a failing test and a
      # coverage figure below the floor are different problems, and a single
      # red step named "Run unit tests" would not say which happened. The tests
      # are already up to date from that step, so this only measures them.
      # koverLogDebug prints the figure into the log of every run;
      # koverVerifyDebug is what fails the job. Skipped when the tests failed —
      # there is nothing to measure then — while the report upload below still
      # runs on always().
      - name: Verify coverage
        if: steps.decide.outputs.run == 'true'
        run: ./gradlew koverLogDebug koverVerifyDebug --stacktrace

      - name: Upload test report
        # always() alone would upload nothing from a skipped job and hide the
        # decision behind a missing artifact.
        if: always() && steps.decide.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  instrumented-tests:
    name: Instrumented tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    # Its own job and not a step of Unit tests: the emulator dominates the wall
    # clock of whatever job it sits in, and a flaky boot must not hide the
    # coverage, formatting and lint verdicts, which have nothing to do with a
    # device. The androidTest sources are older than this job and CI had never
    # executed one of them — NoiseEngineHammerTest, 100 start/stop cycles
    # against a real AudioTrack, ran only when someone typed
    # connectedAndroidTest on a machine with a device attached.
    strategy:
      # Both legs report. A flake on one level must not cancel the other, or the
      # run says nothing about the level that was still working.
      fail-fast: false
      matrix:
        include:
          # The floor and the ceiling of the range the app claims: minSdk 26 and
          # targetSdk/compileSdk 36 in app/build.gradle.kts. They are the two
          # ends a failure can be acted on — below the floor the app is not
          # installed at all, above the ceiling it is not compiled against yet —
          # and the levels between them differ from one end or the other, never
          # from both.
          - api-level: 26
            # No ATD system image exists below API 30, so the floor runs the
            # plain one. The ceiling takes aosp_atd instead: a stripped image
            # without the Play services boots faster and flakes less, and
            # nothing in app/src/androidTest asks for them.
            target: default
          - api-level: 36
            target: aosp_atd
    # An emulator that never boots has to fail this job rather than sit there
    # until the six-hour default gives up on it.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The decision below diffs against the pull request's merge base, so
          # the history has to reach it. Nothing else in this job needs the
          # depth: it builds the debug variant, and the release versioning gate
          # in app/build.gradle.kts only guards the tasks that package a
          # release.
          fetch-depth: 0

      # The if: goes on every step below, never on the job — the same rule the
      # other four Gradle jobs follow, and for the same reason: this job is meant to
      # become a required status check, and a job skipped at job level reports
      # no context at all, which blocks the merge button rather than freeing it.
      # Skipped at step level it still reports green, in seconds. Guardrails is
      # the one required check here carrying a job-level if:, because it
      # compares against the pull request's base commit and a push to main has
      # nothing to compare against; alpha carries one too and is deliberately
      # not required. Neither is this job's situation, and neither is the
      # pattern to copy.
      - name: Decide whether there is work
        id: decide
        uses: ./.github/actions/decide-work

      - name: Set up JDK 17
        if: steps.decide.outputs.run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.decide.outputs.run == 'true'
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        if: steps.decide.outputs.run == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Provide google-services.json
        if: steps.decide.outputs.run == 'true'
        uses: ./.github/actions/google-services
        with:
          secret-b64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}

      - name: Free disk space for the emulator
        if: steps.decide.outputs.run == 'true'
        # The emulator refuses to start unless 120% of its userdata partition is
        # free, and it counts more strictly than df does: on SpendControl, the
        # pipeline this job is modelled on, it refused while df on the same
        # runner reported gigabytes to spare. So the margin to widen is the
        # emulator's and the only way to widen it is to delete something. The
        # NDK is several gigabytes and nothing here compiles native code; dotnet
        # and ghc are the other two large toolchains the runner image ships and
        # this project uses neither. The df lines around the removal are what
        # makes a future refusal readable at all.
        run: |
          df -h /
          sudo rm -rf "$ANDROID_HOME/ndk" /usr/share/dotnet /opt/ghc
          df -h /

      - name: Enable KVM
        if: steps.decide.outputs.run == 'true'
        # The runner image ships KVM but leaves the device owned by root, and
        # without access to it the emulator falls back to software rendering —
        # tens of minutes instead of a few, against the 45-minute cap above.
        # This hands the device to everyone on the runner.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        if: steps.decide.outputs.run == 'true'
        # Pinned to the tag, not to a commit. This repository SHA-pins exactly
        # one action — wzieba/Firebase-Distribution-Github-Action in the alpha
        # job — and the reason is written beside it: that step is handed a
        # service account, so whoever could move the tag would get the
        # credential. This one is handed no secret, so it follows the convention
        # every other third-party action in this workflow follows: pinned to its
        # tag.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          # -no-snapshot-save keeps every run a cold boot: a snapshot would be
          # written into a runner discarded minutes later, and a stale snapshot
          # is the classic way an emulator job starts failing for reasons no
          # diff explains. No window and no boot animation because nobody is
          # watching this one.
          #
          # -noaudio is deliberately absent, and it is the one option this job
          # does not take from SpendControl. SpendControl's instrumented tests
          # touch Room and a file store; this project's NoiseEngineHammerTest
          # writes to a real AudioTrack and asserts on how long stop() blocks
          # its caller. Without an audio sink the guest still accepts the
          # writes, only far more slowly: measured on a local API 36 emulator,
          # the same 100 cycles put the worst stop() at 1158 ms with -noaudio
          # against the test's 1000 ms bound, and at 321 ms without it. So the
          # flag does not silence a test that has nothing to do with audio here
          # — it fails the one test this job exists to run.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -no-boot-anim -camera-back none
          disable-animations: true
          # The debug variant only: a release build needs the SN_* signing
          # credentials, which this job is not given and has no use for.
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test report
        # always() alone would upload nothing from a skipped job and hide the
        # decision behind a missing artifact.
        if: always() && steps.decide.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          # The API level is part of the name because upload-artifact@v4 fails
          # on a duplicate one and both matrix legs reach this step.
          name: instrumented-test-report-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
          if-no-files-found: ignore

  format:
    name: Format
    runs-on: ubuntu-latest
    # Separate from Lint for the same reason Lint is separate from Unit tests:
    # a misplaced brace and a real lint finding are different problems, and one
    # should not hide the other behind a single red job.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Spotless ratchets from origin/main (see the root build.gradle.kts),
          # so that ref has to exist. The default shallow, single-branch
          # checkout has neither the ref nor the history to resolve it, and
          # every spotless task fails outright rather than checking nothing.
          fetch-depth: 0

      - name: Decide whether there is work
        id: decide
        uses: ./.github/actions/decide-work

      - name: Set up JDK 17
        if: steps.decide.outputs.run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.decide.outputs.run == 'true'
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        if: steps.decide.outputs.run == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Provide google-services.json
        if: steps.decide.outputs.run == 'true'
        uses: ./.github/actions/google-services
        with:
          secret-b64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}

      - name: Check formatting
        # Only files this branch changed relative to main are checked. On a
        # push to main the diff is empty, so this job passes without work.
        if: steps.decide.outputs.run == 'true'
        run: ./gradlew spotlessCheck --stacktrace

  detekt:
    name: Detekt
    runs-on: ubuntu-latest
    # Its own job for the same reason Format and Lint are: a complexity finding
    # and a formatting slip are answered differently, and one red job should not
    # hide the other.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For the decision below, not for detekt: unlike Format, detekt has no
          # ratchet — it analyses the whole source tree every run and the
          # historical findings sit in config/detekt/baseline.xml instead.
          fetch-depth: 0

      - name: Decide whether there is work
        id: decide
        uses: ./.github/actions/decide-work

      - name: Set up JDK 17
        if: steps.decide.outputs.run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.decide.outputs.run == 'true'
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        if: steps.decide.outputs.run == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Provide google-services.json
        if: steps.decide.outputs.run == 'true'
        uses: ./.github/actions/google-services
        with:
          secret-b64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}

      - name: Run detekt
        if: steps.decide.outputs.run == 'true'
        run: ./gradlew detekt --stacktrace

      - name: Upload detekt report
        if: always() && steps.decide.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: |
            build/reports/detekt/detekt.html
            build/reports/detekt/detekt.xml
          if-no-files-found: warn

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Independent of unit-tests: a lint regression and a failing test are
    # different problems, and seeing both in one run beats fixing them serially.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The decision below diffs against the pull request's merge base; lint
          # itself needs no history.
          fetch-depth: 0

      - name: Decide whether there is work
        id: decide
        uses: ./.github/actions/decide-work

      - name: Set up JDK 17
        if: steps.decide.outputs.run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.decide.outputs.run == 'true'
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        if: steps.decide.outputs.run == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Provide google-services.json
        if: steps.decide.outputs.run == 'true'
        uses: ./.github/actions/google-services
        with:
          secret-b64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}

      - name: Run lint
        if: steps.decide.outputs.run == 'true'
        # warningsAsErrors is on and the 25 findings this code already carries
        # sit in app/lint-baseline.xml, so this fails on new warnings only.
        # Lint reports 40 in total: the other 11 are version-currency checks,
        # marked informational in app/build.gradle.kts because their messages
        # embed version numbers and stop matching a baseline as releases appear.
        run: ./gradlew lint --stacktrace

      - name: Upload lint report
        if: always() && steps.decide.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          # warn, not ignore: these paths are hardcoded to the debug variant, so
          # a variant change or an AGP rename would leave an empty artifact on
          # exactly the run where the report is needed — lint failing is when
          # someone comes looking for it. Not error either: the build already
          # failed for a real reason, and burying that under a missing-file
          # error helps nobody.
          if-no-files-found: warn

  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    # Pull requests only. The check is a comparison against the base commit, and
    # a push to main has nothing to compare against.
    if: github.event_name == 'pull_request'
    # No JDK, no Android SDK, no Gradle, no google-services.json: this job reads
    # the diff and counts lines. Adding the setup steps every other job here
    # needs would turn seconds into minutes for no gain.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed to reach the base commit: the default shallow checkout cannot
          # resolve github.event.pull_request.base.sha.
          fetch-depth: 0

      - name: Baselines only shrink
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # Counts an entry, not a line: one signature per entry in both files.
          #
          # The lint pattern is deliberately '<issue( |$)' and not '<issue'. The
          # latter also matches the root <issues> element, so it reports 26 where
          # the file holds 25 — and the first entry a PR adds would slip through
          # unnoticed. Both counts are stated in CLAUDE.md; verify with
          #   git show origin/main:app/lint-baseline.xml     | grep -cE '<issue( |$)'   # 25
          #   git show origin/main:config/detekt/baseline.xml | grep -c '<ID>'          # 14
          count_at() { # <ref-or-empty-for-worktree> <path> <pattern>
            if [ -n "$1" ]; then
              git cat-file -e "$1:$2" 2>/dev/null || { echo 0; return; }
              git show "$1:$2" | grep -cE "$3" || true
            else
              [ -f "$2" ] || { echo 0; return; }
              grep -cE "$3" "$2" || true
            fi
          }

          status=0
          check() { # <path> <pattern>
            before=$(count_at "$BASE_SHA" "$1" "$2")
            after=$(count_at "" "$1" "$2")
            echo "$1: $before -> $after"
            if [ "$after" -gt "$before" ]; then
              echo "::error file=$1::$1 grew from $before to $after entries. Baselines only ever shrink (CLAUDE.md, CI section): fix the finding instead of recording it. A baseline may grow only in a PR whose subject is the baseline itself."
              status=1
            fi
          }

          check app/lint-baseline.xml '<issue( |$)'
          check config/detekt/baseline.xml '<ID>'
          exit $status

      - name: No test silently disabled
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # Added lines only. Removing an @Ignore is a test coming back, which is
          # the direction this check exists to protect.
          annotation='@([[:alnum:]_]+\.)*(Ignore|Disabled)\b'
          status=0

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            # Held in variables rather than piped straight into grep -q: -q
            # exits on the first match, and the SIGPIPE that kills the producer
            # would then fail the pipeline under pipefail — skipping the very
            # file that matched.
            diff=$(git diff "$BASE_SHA...HEAD" -- "$file")
            # The +++ header is dropped by its own grep rather than by an
            # ^\+[^+] prefix. That prefix consumes the first character after the
            # +, which for an annotation in column 0 is the @ itself — so
            # +@Ignore("flaky") and +@org.junit.Ignore, the form that switches a
            # whole class off, went through unseen while only the indented
            # method-level one matched.
            added=$(grep -E '^\+' <<<"$diff" | grep -vE '^\+\+\+' || true)
            grep -qE "$annotation" <<<"$added" || continue
            status=1
            # The diff says the line was added; the worktree says where it is now.
            while IFS=: read -r line _; do
              echo "::error file=$file,line=$line::Test disabled by an annotation added in this PR. Never weaken a test to get a green build (CLAUDE.md, \"Tests are mandatory\"): fix the test or the code it covers, or make the case in review."
            done < <(grep -nE "$annotation" "$file")
          done < <(git diff --name-only --diff-filter=d "$BASE_SHA...HEAD" -- app/src/test app/src/androidTest)

          if [ "$status" -eq 0 ]; then
            echo "No @Ignore/@Disabled added under app/src/test or app/src/androidTest."
          fi
          exit $status

  alpha:
    name: Alpha build (Firebase App Distribution)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    # A merge into main and nothing else. Never on a pull request: this artifact
    # lands on real phones, and a build from an unmerged branch is not what
    # anyone agreed to test.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # No concurrency group of its own: the workflow-level key above already
    # serialises runs on main, so two of these never overlap.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Not optional here: versionCode is the commit count, and
          # verifyReleaseVersioning rejects a shallow clone outright rather than
          # letting a stale code reach a published artifact.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Require the real google-services.json
        # The shared action below falls back to a stub when the secret is
        # missing, which is right for a fork pull request and wrong here: a stub
        # ships an app whose Crashlytics and Analytics report to nobody. Asserted
        # before the action rather than inside it, so the fallback rule stays in
        # one place.
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_B64 is unset. An alpha build must carry the real Firebase config, never the stub."
            exit 1
          fi

      - name: Provide google-services.json
        uses: ./.github/actions/google-services
        with:
          secret-b64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}

      - name: Decode the upload keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 is unset. Without it the build would look for the keystore path a developer machine uses and fail deep inside Gradle."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Assemble the signed release APK
        # All four on this step and not on the job: the signingConfig in
        # app/build.gradle.kts reads them as SN_* project properties — the
        # ORG_GRADLE_PROJECT_ prefix is how Gradle maps an environment variable
        # onto one — and this is the only step that signs anything. At job level
        # the upload key's passwords would sit in the environment of every third
        # party action this job runs.
        env:
          ORG_GRADLE_PROJECT_SN_KEY_ALIAS: ${{ secrets.SN_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_SN_KEY_PASSWORD: ${{ secrets.SN_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_SN_STORE_PASSWORD: ${{ secrets.SN_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_SN_STORE_FILE: ${{ runner.temp }}/release.keystore
        run: ./gradlew assembleRelease --stacktrace

      - name: Locate the APK
        id: apk
        # applicationVariants renames the output to
        # SleepNoise-<versionName>-<versionCode>-release.apk, so the name is not
        # known here and the glob is. One release APK is built, hence head -1.
        run: echo "path=$(ls app/build/outputs/apk/release/*.apk | head -1)" >> "$GITHUB_OUTPUT"

      - name: Distribute to Firebase App Distribution
        # v1.7.1, pinned to its commit. A tag is mutable and this step is handed
        # a service account with App Distribution Admin, so whoever could move
        # the tag would get the credential.
        uses: wzieba/Firebase-Distribution-Github-Action@bd494989dd4bec0343f78adee87fe66e48279ad6
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: qa
          # APK and not AAB: App Distribution accepts a bundle only for an app
          # linked to Play and processed there first, while an APK installs from
          # the notification straight away.
          file: ${{ steps.apk.outputs.path }}
          releaseNotes: "Alpha • ${{ github.sha }}"
