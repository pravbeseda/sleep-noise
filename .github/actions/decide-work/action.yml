name: Decide whether this job has work
description: >-
  Reports whether the calling job needs to run its steps for this event and
  diff. Requires a checkout with fetch-depth 0 to have run first: the decision
  is a diff against the pull request's merge base. Which paths count as work is
  the action's own business — see the list at the top of decide.sh.

outputs:
  run:
    description: "'true' when this job has work, 'false' when it does not."
    value: ${{ steps.decide.outputs.run }}

runs:
  using: composite
  steps:
    # Before the decision, not beside it. Nothing else on CI exercises these
    # tests, and a wrong decision is the one failure that reports green: it
    # skips every gate and says so in a log nobody reads.
    - name: Test the decision
      shell: bash
      run: ${{ github.action_path }}/test.sh

    - name: Decide
      id: decide
      shell: bash
      env:
        BASE: ${{ github.event.pull_request.base.sha }}
      run: ${{ github.action_path }}/decide.sh >> "$GITHUB_OUTPUT"
