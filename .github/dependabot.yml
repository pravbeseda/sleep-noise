version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    # One pull request for every minor and patch bump: under strict branch
    # protection each merged bump puts the others behind main. A major that is
    # not ignored below still arrives on its own, so it cannot block the rest.
    groups:
      gradle:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Each major is a migration of its own, recorded in CLAUDE.md: AGP 9 moves
      # Gradle Play Publisher to 4.x with it, and detekt 2.0 wants Kotlin 2.4 / AGP 9.
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.github.triplet.play"
        update-types: ["version-update:semver-major"]
      - dependency-name: "io.gitlab.arturbosch.detekt"
        update-types: ["version-update:semver-major"]
      # Gradle 9.6 removed an internal API every AGP 8.x release relies on.
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
      # androidx.core 1.19 requires compileSdk 37 and AGP 9.1, so it moves with the AGP major.
      - dependency-name: "androidx.core:core-ktx"
        versions: [">=1.19.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
