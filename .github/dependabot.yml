version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    # One pull request for every minor and patch bump: under strict branch
    # protection each merged bump puts the others behind main. A major that is
    # not ignored below still arrives on its own, so it cannot block the rest.
    groups:
      gradle:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # detekt 2.0 is still alpha and moves to the plugin id dev.detekt, a
      # migration of its own recorded in AGENTS.md.
      - dependency-name: "io.gitlab.arturbosch.detekt"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
