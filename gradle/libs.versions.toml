[versions]
agp = "8.13.2"
coreSplashscreen = "1.2.0"
firebaseBom = "34.19.0"
kotlin = "2.2.10"
# 1.18.0, not 1.19: androidx.core 1.19 requires compileSdk 37 and AGP 9.1. Move it
# with the AGP major, not before.
coreKtx = "1.18.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
activity = "1.13.0"
appcompat = "1.8.0"
constraintlayout = "2.2.2"
material = "1.14.0"
detekt = "1.23.8"
spotless = "8.10.2"
ktlint = "1.8.0"
kover = "0.9.9"
# 3.13.0, not 4.x: Gradle Play Publisher 4.0.0 is built against Android Gradle
# Plugin 9, and this project is on AGP 8.12.2 with Gradle 8.13. Move it with the
# AGP major, not before.
playPublisher = "3.13.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
play-publisher = { id = "com.github.triplet.play", version.ref = "playPublisher" }

